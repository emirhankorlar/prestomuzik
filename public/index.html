<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Presto Müzik — Eskişehir Kayıt & Prodüksiyon Stüdyosu</title>
  <meta name="description" content="Eskişehir'de profesyonel vokal ve enstrüman kaydı, mix & mastering, beat prodüksiyon, klip ve dijital dağıtım. Presto Müzik & Medya Co.">
  <meta name="theme-color" content="#0b0907">
  <meta property="og:title" content="Presto Müzik — Kayıt & Prodüksiyon Stüdyosu">
  <meta property="og:description" content="Eskişehir'de kayıt, mix & mastering, beat prodüksiyon ve klip.">
  <meta property="og:image" content="/assets/studio/3.webp">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div class="loader" aria-hidden="true">
    <div class="loader-inner">
      <img src="assets/pm-logo.webp" alt="">
      <div class="loader-meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="mono mute">Sinyal yükleniyor</div>
    </div>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="nav">
    <a class="brand" href="./" aria-label="Presto Müzik ana sayfa"><img src="assets/pm-logo.webp" alt=""><span>Presto Müzik</span></a>
    <div class="timecode mono"><span class="rec-dot"></span>REC <span data-timecode>00:00:00:00</span></div>
    <nav class="nav-links"></nav>
    <button class="menu-btn" aria-label="Menü"><span></span><span></span></button>
  </header>
  <div class="mobile-menu"></div>

  <main id="app">
    <section class="hero" data-scene="0" data-fade="1">
      <div class="hero-top">
        <div class="mono" data-kicker>Eskişehir · Kayıt & Prodüksiyon Stüdyosu</div>
      </div>
      <h1 class="display hero-title split" data-hero-title><span class="split-line"><span>Sesin en hızlı</span></span><span class="split-line"><span><span class="serif">hali.</span></span></span></h1>
      <div class="hero-bottom">
        <div></div>
        <div class="hero-actions reveal">
          <a class="btn" href="#iletisim" data-hero-cta>Seans Ayırt</a>
          <button class="btn btn--ghost" data-hero-listen>▶ Stüdyodan dinle</button>
        </div>
      </div>
    </section>

    <div class="marquee"><div class="marquee-track display" data-marquee></div></div>

    <section class="section about" id="hakkimizda" data-section="about">
      <div class="channel mono"><b data-ch></b> <span data-label></span> <span class="meter" data-meter><i></i><i></i><i></i><i></i></span></div>
      <div class="about-grid">
        <h2 class="display about-title split" data-title></h2>
        <div class="about-copy reveal" data-about></div>
      </div>
      <div class="stats" data-stats></div>
    </section>

    <section class="section services" id="hizmetler" data-section="services">
      <div class="channel mono"><b data-ch></b> <span data-label></span> <span class="meter" data-meter><i></i><i></i><i></i><i></i></span></div>
      <div class="services-head">
        <h2 class="display split" data-title></h2>
        <p class="reveal" data-text></p>
      </div>
      <ul class="svc-list" data-services></ul>
      <div class="svc-preview"><img alt=""></div>
    </section>

    <section class="section studio" id="studyo" data-section="studio">
      <div class="channel mono"><b data-ch></b> <span data-label></span> <span class="meter" data-meter><i></i><i></i><i></i><i></i></span></div>
      <div class="studio-head">
        <h2 class="display split" data-title></h2>
        <a class="btn btn--ghost" href="#iletisim" data-text></a>
      </div>
      <div class="studio-rows" data-gallery></div>
    </section>

    <section class="section artists" id="sanatcilar" data-section="artists">
      <div class="channel mono"><b data-ch></b> <span data-label></span> <span class="meter" data-meter><i></i><i></i><i></i><i></i></span></div>
      <div class="artists-head">
        <h2 class="display split" data-title></h2>
        <p class="reveal" data-text></p>
      </div>
      <div class="team-tabs reveal" data-team-tabs role="tablist"></div>
      <div class="artist-grid" data-artists></div>
      <div class="team-grid" data-team hidden></div>
    </section>

    <section class="section tracks" id="dinle" data-section="tracks">
      <div class="channel mono"><b data-ch></b> <span data-label></span> <span class="meter" data-meter><i></i><i></i><i></i><i></i></span></div>
      <div class="tracks-wrap">
        <h2 class="display split" data-title></h2>
        <ul class="tracklist" data-releases></ul>
      </div>
    </section>

    <section class="section clips" id="klipler" data-section="clips">
      <div class="channel mono"><b data-ch></b> <span data-label></span> <span class="meter" data-meter><i></i><i></i><i></i><i></i></span></div>
      <div class="clips-head">
        <h2 class="display split" data-title></h2>
        <a class="btn btn--ghost" data-youtube data-text target="_blank" rel="noopener"></a>
      </div>
      <div class="clip-grid" data-clips></div>
    </section>

    <section class="section contact" id="iletisim" data-section="contact">
      <div class="channel mono"><b data-ch></b> <span data-label></span> <span class="meter" data-meter><i></i><i></i><i></i><i></i></span></div>
      <div class="contact-grid">
        <div>
          <h2 class="display split" data-title></h2>
          <p class="contact-lead reveal" data-contact-text></p>
          <div class="contact-list reveal" data-contact></div>
        </div>
        <form class="form reveal" data-form>
          <h3 class="display">Seans talebi</h3>
          <div class="form-row">
            <div class="field"><label class="mono" for="f-name">Ad Soyad</label><input id="f-name" name="name" required autocomplete="name"></div>
            <div class="field"><label class="mono" for="f-phone">Telefon</label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
          </div>
          <div class="field">
            <label class="mono" for="f-service">Hizmet</label>
            <select id="f-service" name="service" data-service-select></select>
          </div>
          <div class="field"><label class="mono" for="f-msg">Mesaj</label><textarea id="f-msg" name="message" placeholder="Projeni kısaca anlat: tür, referans, tarih…"></textarea></div>
          <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="form-row">
            <button class="btn" type="submit" data-via="wa">WhatsApp ile gönder</button>
            <button class="btn btn--ghost" type="submit" data-via="mail">E-posta ile gönder</button>
          </div>
          <p class="form-note" data-form-note>Mesajın bize iletilir; WhatsApp ya da e-posta uygulamanda da hazır açılır.</p>
        </form>
      </div>
      <div class="map reveal" data-map></div>
    </section>
  </main>

  <footer class="footer" data-footer></footer>

  <div class="lightbox" data-lightbox hidden>
    <button class="lightbox-close" data-lightbox-close aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <figure><img alt="" data-lightbox-img><figcaption class="mono" data-lightbox-cap></figcaption></figure>
  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
